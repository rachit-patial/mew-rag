name: Approval & Merge Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  preview-diff:
    name: Generate Code Diff & PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          base: main
          title: "PR from ${{ github.ref_name }}"
          body: "Automated PR awaiting review and approval."

  merge-to-main:
    name: Approve & Merge to Main
    needs: preview-diff
    runs-on: ubuntu-latest
    environment: production-approval

    steps:
      - name: Auto-Merge PR after Environment Approval
        run: |
          gh pr merge ${{ github.ref_name }} --auto --merge --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}