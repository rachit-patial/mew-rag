name: Approval & Merge Pipeline

on:
  push:
    branches:
      - 'feature**'

permissions:
  contents: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Calculate and Display Diff
  # -------------------------------------------------------------
  preview-diff:
    name: Generate Code Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so diff works

      - name: Generate Diff against main
        id: diff
        run: |
          echo "## 🔍 Code Changes Diff (Target: main)" >> $GITHUB_STEP_SUMMARY
          echo '```diff' >> $GITHUB_STEP_SUMMARY
          git diff origin/main...${{ github.sha }} >>$GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------
  # STAGE 2: Wait for Manual Approval & Merge
  # -------------------------------------------------------------
  merge-to-main:
    name: Approve & Merge to Main
    needs: preview-diff
    runs-on: ubuntu-latest
    # This environment forces GitHub to pause and wait for your manual approval
    environment: production-approval

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge feature branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout main
          git pull origin main
          git merge --no-ff ${{ github.sha }} -m "Merge branch '${{ github.ref_name }}' into main after manual approval"
          git push origin main