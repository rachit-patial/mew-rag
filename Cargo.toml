[package]
name = "mew-rag"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
text-splitter = "0.19"
fastembed = "5.3"
qdrant-client = "1.18"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
anyhow = "1.0"
sha2 = "0.11.0"
sled = "0.34"
hex = "0.4.3"
